name: Build Android APK

on:
  push:
    branches:
      - dev
      - release
  # pull_request:
  #   branches:
  #     - main
  #     - master

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: 'npm'

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Ionic CLI
        run: npm install -g @ionic/cli

      - name: Install dependencies
        run: npm ci

      - name: Add android directory to PATH
        run: echo "${{ github.workspace }}/android" >> $GITHUB_PATH

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        run: npm run build:android
        env:
          ANDROID_KEYSTORE_BASE64_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_BASE64_PROPERTIES }}

      - name: Build Android Canary APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: npm run build:android:canary
        env:
          ANDROID_KEYSTORE_BASE64_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_BASE64_PROPERTIES }}

      - name: Upload Release APK artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        uses: actions/upload-artifact@v4
        with:
          name: bcrgui-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload Canary APK artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: bcrgui-canary-apk
          path: android/app/build/outputs/apk/canary/*.apk
          retention-days: 7

      - name: Clean sensitive files
        if: always()
        run: rm -rf android/app/build/outputs/keystore/
