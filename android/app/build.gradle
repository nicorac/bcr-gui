apply plugin: 'com.android.application'

/**
 * Load signingConfigs variables from a "keystore.properties" file.
 * Full path of this file is read from ANDROID_KEYSTORE_PROPS environment variable.
 *
 * File content:
 * -----------------------------------------------------------------------------------------
 * storeFile=<full filename of the "*.jks" key file
 * storePassword=<password of the "*.jks" key file>
 * keyAlias=<ID of the key to be used to sign the APK>
 * keyPassword=<password for the key>
 * -----------------------------------------------------------------------------------------
 */
def _keyAlias = ""
def _keyPassword = ""
def _storeFile = ""
def _storePassword = ""

// try to get keystore data from a keystore props file
def keystorePropsFilename = System.getenv("ANDROID_KEYSTORE_PROPS")
if (keystorePropsFilename) {
  System.out.println("Loading Android keystore config from file: " + keystorePropsFilename)
  def keystorePropertiesFile = file(keystorePropsFilename)
  if (keystorePropertiesFile.exists()) {
    def keystoreProperties = new Properties()
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    _keyAlias = keystoreProperties['keyAlias']
    _keyPassword = keystoreProperties['keyPassword']
    _storeFile = keystoreProperties['storeFile']
    _storePassword = keystoreProperties['storePassword']
  } else {
    System.err.println("File not found!");
  }
}
// fallback to env variables (used in CI builds)
else {
  System.out.println("Loading Android keystore config from environment variables")
  _keyAlias = System.getenv("ANDROID_KEYSTORE_KEYALIAS")
  _keyPassword = System.getenv("ANDROID_KEYSTORE_KEYPASSWORD")
  _storeFile = System.getenv("ANDROID_KEYSTORE_STOREFILE")
  _storePassword = System.getenv("ANDROID_KEYSTORE_STOREPASSWORD")
}

// load keystore file
if (!keystorePropsFilename && (!_keyAlias || !_keyPassword || !_storeFile || !_storePassword)) {
  throw new GradleException("Missing required ANDROID_KEYSTORE_* environment variables or ANDROID_KEYSTORE_PROPS filename");
}
def keystoreFileContent = file(_storeFile)
if (!keystoreFileContent.exists()) {
  throw new GradleException("Specified Android keystore file cannot be found: " + keystoreProperties['storeFile']);
}


android {
  compileSdkVersion rootProject.ext.compileSdkVersion
  namespace "com.github.nicorac.bcrgui"
  defaultConfig {
    applicationId "com.github.nicorac.bcrgui"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    // version parts: M = Major, m = minor, b = build
    // -------- MMMmmmbbb
    versionCode 1009002
    versionName "1.9.2"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    aaptOptions {
       // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
       // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
      ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
  }

  // signature config (release only)
  signingConfigs {
    release {
      keyAlias _keyAlias
      keyPassword _keyPassword
      storeFile keystoreFileContent
      storePassword _storePassword
    }
  }
  buildTypes {
    debug {
      applicationIdSuffix '.debug'
      versionNameSuffix "-debug"
    }
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
      signingConfig signingConfigs.release
    }
  }

  // change generated apk name for release builds
  applicationVariants.all { variant ->
    if (variant.buildType.name == 'release') {
      variant.outputs.all {
        outputFileName = "bcr-gui-${defaultConfig.versionName}-${variant.buildType.name}.apk"
      }
    }
  }

  sourceSets {
    main {
      manifest.srcFile 'src/main/AndroidManifest.xml'
      res.srcDirs = ['src/main/res']
    }
    debug {
      manifest.srcFile 'src/debug/AndroidManifest.xml'
      res.srcDirs = ['src/debug/res']
    }
//    release {
//      manifest.srcFile 'src/release/AndroidManifest.xml'
//      res.srcDirs = ['src/release/res']
//    }
  }
}

repositories {
  flatDir{
    dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
  }
}

dependencies {
  implementation fileTree(include: ['*.jar'], dir: 'libs')
  implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
  implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
  implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
  implementation project(':capacitor-android')
  implementation 'androidx.documentfile:documentfile:1.0.1'
  testImplementation "junit:junit:$junitVersion"
  androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
  androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
  implementation project(':capacitor-cordova-android-plugins')
  implementation 'androidx.media3:media3-exoplayer:1.4.1'
  implementation 'androidx.media3:media3-session:1.4.1'
}

apply from: 'capacitor.build.gradle'

try {
  def servicesJSON = file('google-services.json')
  if (servicesJSON.text) {
    apply plugin: 'com.google.gms.google-services'
  }
} catch(Exception e) {
  logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
