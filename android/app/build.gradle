apply plugin: 'com.android.application'

/**
 * Load signingConfigs variables from a "keystore.properties" file.
 * Full path of this file is read from ANDROID_KEYSTORE_PROPS environment variable.
 *
 * File content:
 * -----------------------------------------------------------------------------------------
 * storeFile=<full filename of the "*.jks" keystore file
 * storePassword=<password of the "*.jks" keystore file>
 * keyAlias=<ID of the key to be used to sign the APK>
 * keyPassword=<password of the key>
 * -----------------------------------------------------------------------------------------
 *
 * In CI environment the same informations are extracted from
 * the ANDROID_KEYSTORE_BASE64_PROPERTIES secret, which contains
 * -----------------------------------------------------------------------------------------
 * storeBase64=MIIKMAIBAzCCCdoGCSqGSIb3DQ..... (base64 version of the keystore)
 * storePassword=<password of the keystore>
 * keyAlias=<ID of the key to be used to sign the APK>
 * keyPassword=<password of the key>
 * -----------------------------------------------------------------------------------------
 */

// Extract JSON secret from CI if present and set up local properties path
System.println("=== Testing ANDROID_KEYSTORE_BASE64_PROPERTIES env key ===")
def keystoreBase64Content = System.getenv("ANDROID_KEYSTORE_BASE64_PROPERTIES")
def keystorePropsPath = ""

if (keystoreBase64Content != null && !keystoreBase64Content.isEmpty()) {
  System.println("Extracting temp keystore from ANDROID_KEYSTORE_BASE64_PROPERTIES secret")
  try {
    def props = new Properties()
    props.load(new StringReader(keystoreBase64Content))

    // Extract .jks file from Base64 into build directory
    def keystoreFile = file("${layout.buildDirectory.get()}/outputs/keystore/release.jks")
    keystoreFile.parentFile.mkdirs()
    keystoreFile.bytes = props.storeBase64.decodeBase64()

    // Generate temporary .properties file
    def tempPropsFile = file("${layout.buildDirectory.get()}/outputs/keystore/keystore.properties")
    tempPropsFile.text = """
      storeFile=${keystoreFile.absolutePath}
      storePassword=${props.storePassword}
      keyAlias=${props.keyAlias}
      keyPassword=${props.keyPassword}
    """.stripIndent()

    // Override the path variable so Step 2 reads this temporary file
    keystorePropsPath = tempPropsFile.absolutePath
  } catch (Exception e) {
    System.err.println("Failed to process ANDROID_KEYSTORE_BASE64_PROPERTIES: " + e.message)
  }
}
else {
  keystorePropsPath = System.getenv("ANDROID_KEYSTORE_PROPS")
}

// Read properties file (works for both local ANDROID_KEYSTORE_PROPS and CI generated file)
System.print("Loading Android keystore config from: ")
System.println(keystorePropsPath)
def keystoreProperties = new Properties()

if (keystorePropsPath != null && !keystorePropsPath.isEmpty()) {
  def keystorePropertiesFile = file(keystorePropsPath)
  if (keystorePropertiesFile.exists()) {
    System.out.println("Loading Android keystore config from: " + keystorePropsPath)
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
  }
}

android {
  compileSdkVersion rootProject.ext.compileSdkVersion
  namespace "com.github.nicorac.bcrgui"
  defaultConfig {
    applicationId "com.github.nicorac.bcrgui"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    // version parts: M = Major, m = minor, b = build
    // -------- MMMmmmbbb
    versionCode 1016000
    versionName "1.16.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    aaptOptions {
       // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
       // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
      ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
  }

  // signature config (release only)
  signingConfigs {
    main {
      keyAlias keystoreProperties['keyAlias']
      keyPassword keystoreProperties['keyPassword']
      storeFile file(keystoreProperties['storeFile'])
      storePassword keystoreProperties['storePassword']
    }
  }
  buildTypes {
    debug {
      applicationIdSuffix '.debug'
      versionNameSuffix "-debug"
    }
    canary {
      initWith release
      applicationIdSuffix '.canary'
      versionNameSuffix "-canary"
      signingConfig signingConfigs.main
      matchingFallbacks = ['release']
    }
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      signingConfig signingConfigs.main
    }
  }

  // change generated apk name for non-debug builds
  applicationVariants.all { variant ->
    if (variant.buildType.name != 'debug') {
      variant.outputs.all {
        outputFileName = "bcr-gui-${defaultConfig.versionName}-${variant.buildType.name}.apk"
      }
    }
  }

  sourceSets {
    debug {
      manifest.srcFile 'src/debug/AndroidManifest.xml'
      res.srcDirs = ['src/debug/res']
    }
    canary {
      manifest.srcFile 'src/canary/AndroidManifest.xml'
      res.srcDirs = ['src/canary/res']
    }
    main {
      manifest.srcFile 'src/main/AndroidManifest.xml'
      res.srcDirs = ['src/main/res']
    }
  }
}

repositories {
  flatDir{
    dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
  }
}

dependencies {
  implementation fileTree(include: ['*.jar'], dir: 'libs')
  implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
  implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
  implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
  implementation project(':capacitor-android')
  implementation 'androidx.documentfile:documentfile:1.0.1'
  testImplementation "junit:junit:$junitVersion"
  androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
  androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
  implementation project(':capacitor-cordova-android-plugins')
  implementation 'androidx.media3:media3-exoplayer:1.4.1'
  implementation 'androidx.media3:media3-session:1.4.1'
}

apply from: 'capacitor.build.gradle'

try {
  def servicesJSON = file('google-services.json')
  if (servicesJSON.text) {
    apply plugin: 'com.google.gms.google-services'
  }
} catch(Exception e) {
  logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
